spring.application.name=Medico

# Render / Docker: dynamic port
server.port=${PORT:8080}

# Local credentials (gitignored; development only)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medico_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medico_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:HospySecretKeyParaJWT2024DebeSerLargaYSegura123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Redis is optional. Without REDIS_URL the live channel stays inside this one server.
hospy.redis.url=${REDIS_URL:}

# ===== Hospy AI =====
# Claude first when ANTHROPIC_API_KEY is set. Otherwise Gemini, then OpenAI.
# With no keys, AiService runs in local demo mode.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.8-flash}
ai.gemini.light-model=${GEMINI_LIGHT_MODEL:gemini-3.5-flash-lite}
ai.gemini.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
ai.anthropic.url=${ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
ai.openai.audio-url=${OPENAI_AUDIO_URL:https://api.openai.com/v1/audio/transcriptions}
ai.openai.timeout-seconds=${AI_TIMEOUT:45}

# Optional SMTP for reschedule notices
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:noreply@hospy.local}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-http-post-size=12MB
spring.codec.max-in-memory-size=12MB
