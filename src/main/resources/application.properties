spring.application.name=Medico

# Render / Docker: puerto dinámico
server.port=${PORT:8080}

# Carga credenciales locales (archivo en .gitignore, solo desarrollo)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medico_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medico_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:HospySecretKeyParaJWT2024DebeSerLargaYSegura123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Inteligencia Artificial (Hospy AI) =====
# OpenAI (Render Variable: OPENAI_API_KEY). Si falta, el AiService corre en modo MOCK (demo).
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
# Tiempo máximo de llamada a LLM en segundos
ai.openai.timeout-seconds=${OPENAI_TIMEOUT:45}

# Notificaciones de reprogramación (SMTP opcional)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:noreply@hospy.local}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
